name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish app package
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Read version from project.yml
        id: version
        run: |
          VERSION=$(grep 'MARKETING_VERSION' project.yml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid MARKETING_VERSION: $VERSION" >&2
            exit 1
          fi
          EXPECTED_TAG="v$VERSION"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "$EXPECTED_TAG" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match MARKETING_VERSION $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build Release
        run: |
          xcodegen generate
          xcodebuild \
            -project GitSwitch.xcodeproj \
            -scheme GitSwitch \
            -configuration Release \
            -derivedDataPath build/Release \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
            DEVELOPMENT_TEAM= \
            build

      - name: Package
        run: |
          VERSION='${{ steps.version.outputs.version }}'
          ditto -c -k --sequesterRsrc --keepParent \
            build/Release/Build/Products/Release/GitSwitch.app \
            "GitSwitch-$VERSION.app.zip"
          shasum -a 256 "GitSwitch-$VERSION.app.zip" > "GitSwitch-$VERSION.app.zip.sha256"

      - name: Verify package
        run: |
          VERSION='${{ steps.version.outputs.version }}'
          codesign --verify --deep --strict --verbose=2 \
            build/Release/Build/Products/Release/GitSwitch.app
          shasum -a 256 -c "GitSwitch-$VERSION.app.zip.sha256"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION='${{ steps.version.outputs.version }}'
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v$VERSION"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite published assets." >&2
            exit 1
          fi
          echo "Publishing $TAG"
          gh release create "$TAG" \
            --draft \
            --title "GitSwitch $TAG" \
            --notes "GitSwitch $VERSION

          附件为 ad-hoc 签名的应用包（.app.zip）及 SHA-256 校验文件。
          本机安装仍推荐使用 scripts/build_and_install.sh；其他设备首次运行需右键打开以绕过 Gatekeeper。

          变更记录：https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/CHANGELOG.md" \
            "GitSwitch-$VERSION.app.zip" \
            "GitSwitch-$VERSION.app.zip.sha256" \
          && gh release edit "$TAG" --draft=false
